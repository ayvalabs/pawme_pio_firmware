; PlatformIO Project Configuration File for PawMe Firmware
; XIAO ESP32S3 Sense (with camera)

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.mcu = esp32s3

; Enable PSRAM for camera buffer
build_flags = 
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1

; Libraries
lib_deps = 
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
    bblanchon/ArduinoJson@^7.0.0

; Monitor settings
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0

; Upload settings
upload_speed = 921600
